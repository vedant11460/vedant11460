<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180" role="img" aria-label="Animated F1 car racing across a track" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .car   { animation: drive 5s linear infinite; }
    .spin  { transform-box: fill-box; transform-origin: center; animation: spin 0.25s linear infinite; }
    .mid   { animation: scroll60 0.6s linear infinite; }
    .kerb  { animation: scroll40 0.5s linear infinite; }
    .speed { animation: flicker 0.2s steps(2) infinite; }
    @keyframes drive   { from { transform: translate(-190px, 71px); } to { transform: translate(830px, 71px); } }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes scroll60 { to { stroke-dashoffset: -60; } }
    @keyframes scroll40 { to { stroke-dashoffset: -40; } }
    @keyframes flicker { 0% { opacity: 0.15; } 100% { opacity: 0.7; } }
    text { font-family: 'Courier New', monospace; font-weight: bold; }
  </style>

  <!-- background -->
  <rect width="800" height="180" rx="14" fill="#15151E"/>
  <text x="400" y="34" text-anchor="middle" font-size="15" fill="#ffffff" letter-spacing="3">VEDANT DESHMUKH  |  DATA ANALYST</text>

  <!-- asphalt -->
  <rect x="0" y="60" width="800" height="70" fill="#2A2A33"/>

  <!-- kerbs (red and white) -->
  <line class="kerb" x1="0" y1="62" x2="800" y2="62" stroke="#E10600" stroke-width="6" stroke-dasharray="20 20"/>
  <line class="kerb" x1="0" y1="62" x2="800" y2="62" stroke="#ffffff" stroke-width="6" stroke-dasharray="20 20" stroke-dashoffset="-20" style="animation-name: scroll40b"/>
  <line class="kerb" x1="0" y1="128" x2="800" y2="128" stroke="#E10600" stroke-width="6" stroke-dasharray="20 20"/>
  <line class="kerb" x1="0" y1="128" x2="800" y2="128" stroke="#ffffff" stroke-width="6" stroke-dasharray="20 20" stroke-dashoffset="-20" style="animation-name: scroll40b"/>
  <style>
    @keyframes scroll40b { from { stroke-dashoffset: -20; } to { stroke-dashoffset: -60; } }
  </style>

  <!-- center dashes -->
  <line class="mid" x1="0" y1="95" x2="800" y2="95" stroke="#ffffff" stroke-width="3" stroke-dasharray="30 30" opacity="0.8"/>

  <!-- car (static fallback position via transform attribute; CSS animation overrides it) -->
  <g class="car" transform="translate(60,71)">
    <!-- speed lines -->
    <g class="speed" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
      <line x1="-70" y1="14" x2="-14" y2="14"/>
      <line x1="-55" y1="22" x2="-8" y2="22"/>
      <line x1="-80" y1="30" x2="-12" y2="30"/>
    </g>

    <!-- rear wing -->
    <rect x="7" y="9" width="3" height="9" fill="#333"/>
    <rect x="0" y="5" width="20" height="4" rx="1" fill="#111"/>
    <rect x="0" y="3" width="3" height="10" fill="#E10600"/>

    <!-- body -->
    <path d="M6 28 L10 14 L36 14 L50 8 L62 12 L90 20 L150 27 L150 31 L6 31 Z" fill="#E10600"/>
    <!-- sidepod accent -->
    <path d="M30 18 L62 18 L84 24 L30 24 Z" fill="#B30500"/>
    <!-- number stripe -->
    <rect x="40" y="25" width="26" height="3" fill="#ffffff" opacity="0.9"/>
    <!-- helmet and halo -->
    <circle cx="58" cy="8" r="5" fill="#FFD400"/>
    <path d="M50 12 Q58 0 70 11" fill="none" stroke="#111" stroke-width="2"/>

    <!-- front wing -->
    <rect x="140" y="30" width="24" height="3" rx="1" fill="#111"/>
    <rect x="160" y="25" width="3" height="9" fill="#E10600"/>

    <!-- rear wheel -->
    <circle cx="26" cy="28" r="11" fill="#0b0b0b"/>
    <circle cx="26" cy="28" r="5" fill="#9a9a9a"/>
    <g class="spin" stroke="#222" stroke-width="2">
      <line x1="21" y1="28" x2="31" y2="28"/>
      <line x1="26" y1="23" x2="26" y2="33"/>
    </g>

    <!-- front wheel -->
    <circle cx="122" cy="29" r="9" fill="#0b0b0b"/>
    <circle cx="122" cy="29" r="4" fill="#9a9a9a"/>
    <g class="spin" stroke="#222" stroke-width="2">
      <line x1="118" y1="29" x2="126" y2="29"/>
      <line x1="122" y1="25" x2="122" y2="33"/>
    </g>
  </g>

  <text x="400" y="160" text-anchor="middle" font-size="13" fill="#E10600" letter-spacing="2">LAP ∞  |  PYTHON · SQL · PANDAS</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
